spring.application.name=plazoleta-ms
server.port=8082

# Base de datos H2 en archivo (los datos no se pierden al apagar la app)
spring.datasource.url=jdbc:h2:file:./data/plazoletadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola: http://localhost:8082/h2-console
spring.h2.console.enabled=true

# URL de usuarios-ms (debe estar corriendo para crear restaurantes)
usuarios.url=http://localhost:8081

# JWT: debe ser EXACTAMENTE el mismo secreto que usuarios-ms. Mejor por variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:plazoleta-clave-secreta-de-desarrollo-minimo-32-caracteres-0123456789}
